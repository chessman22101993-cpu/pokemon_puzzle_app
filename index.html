<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern, live online chess coaching classroom platform for interactive chess puzzle solving, student tracking, and live progress dashboards." />
    <meta name="keywords" content="chess, classroom, puzzles, coaching, live dashboard, chess lessons, kids chess" />
    <title>Chess Classroom | Live Coaching & Puzzles</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(function() {});
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
